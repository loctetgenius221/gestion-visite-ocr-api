# Intégration continue : rien n'est déployé qui n'a pas passé ces deux jobs.
#
# - `tests`      : lint, typage et suite complète (SQLite en mémoire, ADR-007) ;
# - `securite`   : dépendances vulnérables (pip-audit) et secrets dans
#   l'historique (gitleaks) ;
# - `migrations` : upgrade, downgrade puis upgrade sur un vrai PostgreSQL 16.
#   La suite tourne sur SQLite ; c'est ici que se voient les écarts de dialecte
#   (enums, contraintes, index trigrammes, fusion de données) qui ne
#   surgiraient sinon qu'en production.
#
# Les actions tierces sont épinglées par SHA de commit (audit SEC-010) : une
# étiquette `v4` peut être déplacée vers un autre code, un SHA non. Le
# commentaire donne la version, pour les mises à jour.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Dépendances (versions figées par uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Typage
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q -p no:cacheprovider

  securite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tout l'historique : un secret retiré du code reste dans les commits.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Dépendances vulnérables (production)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt

      - name: Secrets dans l'historique
        # Binaire épinglé et vérifié par empreinte. Faux positifs vérifiés :
        # `.gitleaksignore`.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git . --redact --no-banner

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigv
          POSTGRES_PASSWORD: sigv
          POSTGRES_DB: sigv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sigv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sigv:sigv@localhost:5432/sigv
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Dépendances
        run: uv sync --frozen --no-dev

      - name: Upgrade, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
