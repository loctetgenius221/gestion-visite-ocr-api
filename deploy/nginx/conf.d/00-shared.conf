# Directives partagées par les serveurs HTTP et HTTPS.
# Chargé en premier (ordre alphabétique) : les zones et l'upstream doivent exister
# avant les `server` qui les référencent.

# L'API écoute en local uniquement : elle n'est jamais joignable sans passer par
# ce proxy (voir le service systemd `deploy/systemd/sigv-api.service`).
upstream sigv_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Anti-bourrage de mots de passe : 20 tentatives d'authentification par minute et
# par IP, le reste attend. Les rafales légitimes (refresh de token au réveil de
# l'app) passent grâce au `burst` défini côté location.
limit_req_zone $binary_remote_addr zone=sigv_auth:10m rate=20r/m;

# Garde-fou général : un poste d'accueil ne dépasse pas quelques requêtes/seconde.
limit_req_zone $binary_remote_addr zone=sigv_api:10m rate=20r/s;

limit_req_status 429;

# Les photos de document pèsent quelques Mo : au-delà de ce tampon, nginx écrit le
# corps de la requête dans un fichier temporaire avant de le relayer.
client_body_buffer_size 1m;

server_tokens off;

log_format sigv_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"request_id":"$request_id","user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log sigv_json;
