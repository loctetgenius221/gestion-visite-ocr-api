# Directives partagées par les serveurs HTTP et HTTPS.
# Chargé en premier (ordre alphabétique) : les zones et l'upstream doivent exister
# avant les `server` qui les référencent.

# L'API écoute en local uniquement : elle n'est jamais joignable sans passer par
# ce proxy (voir le service systemd `deploy/systemd/sigv-api.service`).
upstream sigv_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Clé de signature des URLs de fichiers, partagée avec l'API
# (`STORAGE_URL_SIGNING_KEY`). Le fichier n'est pas versionné : voir DEPLOYMENT.md,
# « Accès aux fichiers ». Il contient une seule ligne :
#   map $host $sigv_storage_key { default "<la clé>"; }
include /etc/nginx/sigv-storage-key.conf;

# Anti-bourrage de mots de passe, par IP. Le seuil tient compte du NAT : tous les
# postes d'un ministère sortent souvent par la même adresse publique, et
# l'ouverture du matin en connecte plusieurs dizaines à la fois. Le verrouillage
# de compte après N échecs reste le rempart principal, compte par compte.
limit_req_zone $binary_remote_addr zone=sigv_auth:10m rate=60r/m;

# Garde-fou général, **par jeton** et non par IP : derrière un NAT, une limite par
# adresse ferait partager un seul quota à tout un ministère. Les requêtes sans
# jeton retombent sur l'IP.
map $http_authorization $sigv_api_limit_key {
    default $http_authorization;
    ""      $binary_remote_addr;
}
limit_req_zone $sigv_api_limit_key zone=sigv_api:20m rate=10r/s;

limit_req_status 429;

# Les photos de document pèsent quelques Mo : au-delà de ce tampon, nginx écrit le
# corps de la requête dans un fichier temporaire avant de le relayer.
client_body_buffer_size 1m;

server_tokens off;

log_format sigv_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"request_id":"$request_id","user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log sigv_json;
