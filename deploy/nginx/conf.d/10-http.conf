# Serveur HTTP — à déposer dans /etc/nginx/conf.d/.
#
# Tel quel, il sert l'API en clair : c'est ce qu'il faut pour une première mise en
# route sur l'IP du VPS, et pour laisser Certbot valider le domaine.
# Une fois le certificat émis (voir DEPLOYMENT.md), activez `20-https.conf.example`
# puis remplacez le bloc « API en clair » ci-dessous par la redirection 301.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Marge sur MAX_UPLOAD_SIZE_MB=10 : l'enveloppe multipart ajoute quelques Ko.
    client_max_body_size 12m;

    # Validation ACME — à conserver même après passage en HTTPS, le
    # renouvellement Certbot repasse par ici.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API en clair -------------------------------------------------------
    # À remplacer, une fois le TLS en place, par :
    #   location / { return 301 https://$host$request_uri; }
    include /etc/nginx/conf.d/sigv-app.inc;
}
